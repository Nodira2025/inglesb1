<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CyberEnglish B1 Assessment</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        /* --- ESTILOS CYBERPUNK (Idénticos a versiones anteriores) --- */
        :root {
            --bg-color: #050510;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-yellow: #fee801;
            --neon-green: #00ff41;
            --panel-bg: rgba(20, 20, 30, 0.98);
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            font-family: 'Rajdhani', sans-serif;
            color: white;
            height: 100vh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            overflow: hidden;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        body::before {
            content: " "; display: block; position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        .game-container {
            width: 100%; max-width: 500px; height: 100%;
            display: flex; flex-direction: column; padding: 20px;
            position: relative; z-index: 1;
        }

        .header { display: flex; justify-content: space-between; margin-bottom: 15px; font-family: 'Orbitron', sans-serif; }
        .stat-box {
            border: 1px solid var(--neon-cyan); padding: 8px 15px;
            border-radius: 5px; background: rgba(0,0,0,0.6);
            min-width: 80px; text-align: center; box-shadow: 0 0 10px var(--neon-cyan);
        }
        .timer-box { border-color: var(--neon-pink); box-shadow: 0 0 10px var(--neon-pink); color: var(--neon-pink); }

        .question-card {
            flex-grow: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            margin-bottom: 15px; position: relative;
        }

        .category-badge {
            color: var(--neon-yellow); text-transform: uppercase; letter-spacing: 2px;
            font-weight: bold; margin-bottom: 10px; font-size: 0.9rem;
            text-shadow: 0 0 5px var(--neon-yellow); border-bottom: 1px solid var(--neon-yellow);
            padding-bottom: 5px;
        }

        .question-text { font-size: 1.3rem; line-height: 1.4; font-weight: 700; text-shadow: 2px 2px 0px #000; }

        .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 15px; }

        .option-btn {
            background: rgba(0, 243, 255, 0.05); border: 1px solid var(--neon-cyan);
            color: white; padding: 14px; font-size: 1.1rem;
            font-family: 'Rajdhani', sans-serif; font-weight: bold; cursor: pointer;
            position: relative; overflow: hidden; transition: all 0.2s;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }
        .option-btn:active { background: var(--neon-cyan); color: black; }
        .option-btn.correct { background: var(--neon-green) !important; border-color: var(--neon-green); color: black; box-shadow: 0 0 15px var(--neon-green); }
        .option-btn.wrong { background: var(--neon-pink) !important; border-color: var(--neon-pink); opacity: 0.5; }
        .option-btn.hidden { visibility: hidden; pointer-events: none; }

        .powerups { display: flex; justify-content: space-around; margin-bottom: 10px; }
        .powerup-btn {
            background: transparent; border: 1px solid var(--neon-yellow); color: var(--neon-yellow);
            width: 55px; height: 55px; border-radius: 50%; display: flex; justify-content: center;
            align-items: center; font-size: 0.7rem; font-weight: bold; flex-direction: column;
            box-shadow: 0 0 5px var(--neon-yellow); cursor: pointer;
        }
        .powerup-btn.used { filter: grayscale(100%); opacity: 0.3; pointer-events: none; }
        .powerup-icon { font-size: 1.2rem; margin-bottom: 2px; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 16, 0.98); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 20; text-align: center; padding: 20px;
        }

        #feedback-modal {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: var(--panel-bg); border-top: 2px solid var(--neon-cyan);
            padding: 20px; z-index: 15; border-radius: 20px 20px 0 0;
            transform: translateY(110%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 -5px 20px rgba(0, 243, 255, 0.2);
        }
        #feedback-modal.active { transform: translateY(0); }

        .feedback-title { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; margin-bottom: 10px; text-transform: uppercase; }
        .feedback-text { font-size: 1.1rem; margin-bottom: 20px; color: #ddd; line-height: 1.4; }

        .next-btn {
            width: 100%; padding: 15px; background: var(--neon-cyan); border: none;
            color: black; font-family: 'Orbitron', sans-serif; font-weight: 900;
            font-size: 1.2rem; cursor: pointer;
            clip-path: polygon(15px 0, 100% 0, 100% 100%, 0 100%, 0 15px);
        }

        .glitch-title {
            font-family: 'Orbitron', sans-serif; font-size: 2.5rem; color: var(--neon-pink);
            text-shadow: 2px 0 var(--neon-cyan); margin-bottom: 10px;
        }
        .start-btn {
            background: var(--neon-cyan); color: #000; border: none; padding: 15px 40px;
            font-size: 1.5rem; font-weight: 900; font-family: 'Orbitron', sans-serif; cursor: pointer;
            clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
            box-shadow: 0 0 15px var(--neon-cyan); margin-top: 20px;
        }
        .hidden-screen { display: none !important; }
        .progress-container { width: 100%; height: 4px; background: #333; margin-top: 10px; }
        .progress-bar { height: 100%; background: var(--neon-green); width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay">
        <h1 class="glitch-title">ENGLISH<br>LEVEL B1</h1>
        <p style="color: var(--neon-cyan); margin-bottom: 30px;">INTERMEDIATE PROTOCOL</p>
        <p style="font-size: 0.9rem; color: #aaa; max-width: 300px;">
            Includes: Grammar Rules (ES), Pronunciation, Passive Voice, Conditionals & Phrasal Verbs.
        </p>
        <button class="start-btn" onclick="startGame()">START_TEST</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="overlay hidden-screen">
        <h1 class="glitch-title" id="end-title">ASSESSMENT<br>COMPLETE</h1>
        <p style="font-size: 1.2rem; color: #fff;">FINAL SCORE: <span id="final-score" style="color: var(--neon-green)">0</span></p>
        <p id="feedback-message" style="color: #aaa; margin: 20px 0;"></p>
        <button class="start-btn" onclick="location.reload()">REBOOT</button>
    </div>

    <div class="game-container">
        <div class="header">
            <div class="stat-box">
                <small>SCORE</small><br>
                <span id="score">0</span>
            </div>
            <div class="stat-box timer-box">
                <small>TIME</small><br>
                <span id="timer">30</span>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div style="text-align: right; font-size: 0.8rem; color: #666; margin-bottom: 10px;">
            Q: <span id="q-current">1</span>/50
        </div>

        <div class="question-card">
            <div class="category-badge" id="category">GRAMMAR</div>
            <div class="question-text" id="question">Loading...</div>
        </div>

        <div class="options-grid" id="options-container"></div>

        <div class="powerups">
            <button class="powerup-btn" id="pu-5050" onclick="useFiftyFifty()">
                <span class="powerup-icon">💣</span>
                50/50
            </button>
            <button class="powerup-btn" id="pu-skip" onclick="useSkip()">
                <span class="powerup-icon">⏭️</span>
                SKIP
            </button>
            <button class="powerup-btn" id="pu-time" onclick="useTime()">
                <span class="powerup-icon">⏰</span>
                +15s
            </button>
        </div>
    </div>

    <!-- Feedback Modal -->
    <div id="feedback-modal">
        <h2 class="feedback-title" id="fb-title">CORRECT</h2>
        <p class="feedback-text" id="fb-explanation">Explanation goes here.</p>
        <button class="next-btn" onclick="nextQuestion()">CONTINUE >></button>
    </div>

<script>
    // --- DATA: 50 B1 Level Questions (Mixed English/Spanish Rules/Pronunciation) ---
    const questions = [
        
        // --- TEORÍA GRAMATICAL (CONSIGNAS EN ESPAÑOL) ---
        { q: "El verbo auxiliar 'does' se utiliza con los pronombres...", opt: ["I, You, We, They", "He, She, It", "Todos los pronombres", "Solo con 'It'"], a: 1, cat: "Grammar Rules (ES)", exp: "En Present Simple, la 3ra persona (He/She/It) usa 'Does' o verbos terminados en -s." },
        { q: "¿Qué estructura se usa para acciones que ocurrieron antes de otra acción en el pasado?", opt: ["Past Perfect", "Present Perfect", "Past Continuous", "Simple Past"], a: 0, cat: "Grammar Rules (ES)", exp: "El Past Perfect (Had + Participio) es el 'pasado del pasado'." },
        { q: "El 'Second Conditional' (If I won the lottery...) se utiliza para...", opt: ["Hechos científicos", "Situaciones reales", "Situaciones hipotéticas/imaginarias", "El pasado"], a: 2, cat: "Grammar Rules (ES)", exp: "El 2º condicional expresa situaciones poco probables o imaginarias en el presente/futuro." },
        { q: "En la 'Passive Voice', el énfasis recae sobre...", opt: ["El sujeto que hace la acción", "La acción o el objeto", "El tiempo verbal", "El adjetivo"], a: 1, cat: "Grammar Rules (ES)", exp: "En la voz pasiva, lo importante es qué pasó, no quién lo hizo." },
        { q: "Para hablar de una acción que empezó en el pasado y continúa en el presente usamos...", opt: ["Past Simple", "Present Continuous", "Present Perfect", "Future Simple"], a: 2, cat: "Grammar Rules (ES)", exp: "Ejemplo: I have lived here for 10 years (y sigo viviendo aquí)." },
        { q: "¿Cuál es la diferencia entre 'Must' y 'Have to'?", opt: ["No hay diferencia", "Must es obligación interna, Have to externa", "Must es sugerencia", "Have to es prohibición"], a: 1, cat: "Grammar Rules (ES)", exp: "'Must' suele venir del hablante; 'Have to' viene de una regla o ley externa." },
        { q: "El verbo modal 'Might' expresa...", opt: ["Obligación", "Habilidad", "Posibilidad remota", "Certeza"], a: 2, cat: "Grammar Rules (ES)", exp: "'Might' indica que algo es posible pero no seguro (quizás)." },
        { q: "Usamos 'Used to' para hablar de...", opt: ["Hábitos pasados que ya no ocurren", "Cosas que estamos acostumbrados a hacer", "Planes futuros", "Acciones terminadas ayer"], a: 0, cat: "Grammar Rules (ES)", exp: "Ej: 'I used to play tennis' (antes jugaba, ahora no)." },

        // --- PRONUNCIATION (PHONETICS) ---
        { q: "¿Cómo se pronuncia correctamente la palabra 'Don't'?", opt: ["Dant", "Dint", "Dount (dóunt)", "Dunt"], a: 2, cat: "Pronunciation", exp: "La 'o' es un diptongo /əʊ/. Suena como 'Dóunt'." },
        { q: "¿Cómo se pronuncia 'Comfortable'?", opt: ["Com-for-ta-ble", "Comf-ta-bol", "Com-for-bol", "Com-fuh-bol"], a: 1, cat: "Pronunciation", exp: "En inglés nativo, la sílaba 'or' casi desaparece: /kʌmf-tə-bəl/." },
        { q: "La letra 'L' en las palabras 'Walk' y 'Talk' es...", opt: ["Muy fuerte", "Muda (Silent)", "Suave", "Vibrante"], a: 1, cat: "Pronunciation", exp: "No pronunciamos la L. Suenan como 'Wok' y 'Tok'." },
        { q: "¿Cuál es la pronunciación correcta de 'Since'?", opt: ["Sains", "Sins", "Seins", "Science"], a: 1, cat: "Pronunciation", exp: "La 'i' es corta /ɪ/. Suena como 'Sins'." },
        { q: "La terminación -ed en 'Worked' suena como...", opt: ["/id/ (Workid)", "/d/ (Workd)", "/t/ (Workt)", "/ed/ (Worked)"], a: 2, cat: "Pronunciation", exp: "Después de sonidos sordos como K, la -ed suena como una T." },
        { q: "La palabra 'Island' (Isla) se pronuncia...", opt: ["Ailand", "Is-land", "Eiland", "Ais-land"], a: 0, cat: "Pronunciation", exp: "La 's' es muda. Se pronuncia /aɪlənd/." },
        { q: "¿Cómo suena la 'ch' en 'Chemistry'?", opt: ["Como CH (Chorizo)", "Como K (Kilo)", "Como SH (Show)", "Como S (Sapo)"], a: 1, cat: "Pronunciation", exp: "En palabras de origen griego, CH suena como K (Kemistri)." },

        // --- GRAMÁTICA B1 APLICADA ---
        // Conditionals
        { q: "If I ___ you, I would study harder.", opt: ["was", "were", "am", "be"], a: 1, cat: "2nd Conditional", exp: "En el 2º condicional, usamos 'were' para todas las personas (subjuntivo)." },
        { q: "I will call you as soon as I ___.", opt: ["arrive", "will arrive", "arrived", "am arriving"], a: 0, cat: "Time Clauses", exp: "Después de 'as soon as', 'when', etc., usamos presente simple para futuro." },
        
        // Passive Voice
        { q: "The telephone ___ by Alexander Graham Bell.", opt: ["invented", "is invented", "was invented", "has been invented"], a: 2, cat: "Passive Voice", exp: "Pasado simple pasivo: Was/Were + Participio." },
        { q: "English ___ in many countries.", opt: ["speaks", "is spoken", "spoken", "is speaking"], a: 1, cat: "Passive Voice", exp: "Presente simple pasivo: Is/Are + Participio." },

        // Reported Speech
        { q: "Direct: 'I am tired.' -> Reported: He said he ___ tired.", opt: ["is", "was", "were", "has been"], a: 1, cat: "Reported Speech", exp: "El tiempo verbal retrocede: Presente -> Pasado." },
        { q: "Direct: 'I will help you.' -> Reported: She said she ___ help me.", opt: ["will", "would", "can", "should"], a: 1, cat: "Reported Speech", exp: "'Will' cambia a 'Would' en el estilo indirecto." },

        // Present Perfect Continuous
        { q: "I ___ for you for two hours!", opt: ["wait", "am waiting", "have been waiting", "was waiting"], a: 2, cat: "Pres. Perf. Cont.", exp: "Énfasis en la duración de la acción hasta el presente." },
        { q: "Her eyes are red because she ___ crying.", opt: ["has been", "is", "was", "had"], a: 0, cat: "Pres. Perf. Cont.", exp: "Acción reciente con evidencia visible en el presente." },

        // Modals of Deduction
        { q: "Look at the snow. It ___ be cold outside.", opt: ["can't", "must", "should", "might"], a: 1, cat: "Modals of Deduction", exp: "'Must' indica una certeza lógica (99% seguro)." },
        { q: "That ___ be John. He is in London right now.", opt: ["must", "should", "can't", "mustn't"], a: 2, cat: "Modals of Deduction", exp: "'Can't' indica imposibilidad lógica." },

        // Phrasal Verbs
        { q: "I need to find the meaning. I will look it ___.", opt: ["for", "up", "after", "in"], a: 1, cat: "Phrasal Verbs", exp: "'Look up' significa buscar información (en un diccionario/internet)." },
        { q: "We have run ___ of milk.", opt: ["out", "away", "off", "over"], a: 0, cat: "Phrasal Verbs", exp: "'Run out of' significa quedarse sin algo." },
        { q: "Can you turn ___ the music? It's too loud.", opt: ["up", "down", "on", "in"], a: 1, cat: "Phrasal Verbs", exp: "'Turn down' es bajar el volumen." },

        // Gerunds vs Infinitives
        { q: "I enjoy ___ movies.", opt: ["watch", "to watch", "watching", "watched"], a: 2, cat: "Gerunds", exp: "Después de 'enjoy', siempre usamos verbo con -ing." },
        { q: "She decided ___ to the party.", opt: ["go", "going", "to go", "went"], a: 2, cat: "Infinitives", exp: "Después de 'decide', siempre usamos infinitivo (to go)." },
        { q: "I'm interested ___ learning English.", opt: ["on", "in", "at", "for"], a: 1, cat: "Prepositions", exp: "Adjetivo + Preposición: Interested IN." },

        // Question Tags
        { q: "You haven't seen him, ___?", opt: ["haven't you", "did you", "have you", "do you"], a: 2, cat: "Question Tags", exp: "Oración negativa -> Tag positivo. Auxiliar 'have'." },

        // Relative Clauses
        { q: "The woman ___ car was stolen is my neighbor.", opt: ["who", "which", "whose", "that"], a: 2, cat: "Relative Clauses", exp: "'Whose' indica posesión (cuyo coche)." },

        // Connectors
        { q: "___ it was raining, we played football.", opt: ["Although", "Because", "However", "Despite"], a: 0, cat: "Connectors", exp: "'Although' (Aunque) introduce un contraste." },
        { q: "I didn't study. ___, I passed the exam.", opt: ["Although", "However", "But", "Despite"], a: 1, cat: "Connectors", exp: "'However' (Sin embargo) va seguido de coma." },

        // Make vs Do
        { q: "Did you ___ a mistake?", opt: ["do", "make", "have", "create"], a: 1, cat: "Collocations", exp: "Decimos 'Make a mistake', no 'do'." },
        { q: "Can you ___ me a favor?", opt: ["make", "do", "give", "create"], a: 1, cat: "Collocations", exp: "Decimos 'Do a favor'." },

        // Past Perfect
        { q: "When I arrived at the station, the train ___.", opt: ["left", "has left", "had left", "leaves"], a: 2, cat: "Past Perfect", exp: "El tren se fue ANTES de que yo llegara." },

        // Quantifiers
        { q: "I don't have ___ money.", opt: ["much", "many", "some", "no"], a: 0, cat: "Quantifiers", exp: "Money es incontable. En negativo usamos 'much' o 'any'." },
        { q: "There are too ___ people here.", opt: ["much", "many", "few", "little"], a: 1, cat: "Quantifiers", exp: "People es contable plural -> 'Many'." },

        // Vocabulary
        { q: "If you are 'exhausted', you are...", opt: ["Very happy", "Very sad", "Very tired", "Very angry"], a: 2, cat: "Vocabulary", exp: "Exhausted es un adjetivo extremo para 'cansado'." },
        { q: "To 'get along' with someone means...", opt: ["To argue", "To have a good relationship", "To travel together", "To work together"], a: 1, cat: "Phrasal Verbs", exp: "Get along = Llevarse bien." },
        { q: "Synonym of 'Wealthy':", opt: ["Poor", "Rich", "Healthy", "Weak"], a: 1, cat: "Vocabulary", exp: "Wealthy significa adinerado o rico." }
    ];

    // --- LOGICA DEL JUEGO (Mismo motor) ---
    let shuffledQuestions = [];
    let currentQIndex = 0;
    let score = 0;
    let timeLeft = 30;
    let timerInterval;
    let isPaused = false; 

    let powerUps = { fifty: true, skip: true, time: true };

    const ui = {
        score: document.getElementById('score'),
        timer: document.getElementById('timer'),
        question: document.getElementById('question'),
        category: document.getElementById('category'),
        options: document.getElementById('options-container'),
        startScreen: document.getElementById('start-screen'),
        gameOver: document.getElementById('game-over-screen'),
        finalScore: document.getElementById('final-score'),
        feedbackMsg: document.getElementById('feedback-message'),
        modal: document.getElementById('feedback-modal'),
        modalTitle: document.getElementById('fb-title'),
        modalExp: document.getElementById('fb-explanation'),
        progress: document.getElementById('progress-bar'),
        qCurrent: document.getElementById('q-current'),
        gameOverTitle: document.getElementById('end-title')
    };

    function startGame() {
        ui.startScreen.classList.add('hidden-screen');
        shuffledQuestions = [...questions].sort(() => Math.random() - 0.5);
        score = 0;
        currentQIndex = 0;
        ui.score.innerText = '0';
        powerUps = { fifty: true, skip: true, time: true };
        document.querySelectorAll('.powerup-btn').forEach(btn => btn.classList.remove('used'));
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQIndex >= shuffledQuestions.length) {
            endGame(true);
            return;
        }
        isPaused = false;
        ui.modal.classList.remove('active');
        const q = shuffledQuestions[currentQIndex];
        
        ui.category.innerText = q.cat;
        ui.question.innerText = q.q;
        ui.options.innerHTML = '';
        ui.qCurrent.innerText = currentQIndex + 1;
        
        const pct = ((currentQIndex) / shuffledQuestions.length) * 100;
        ui.progress.style.width = pct + '%';

        clearInterval(timerInterval);
        timeLeft = 25; 
        updateTimer();
        startTimer();

        q.opt.forEach((optText, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = optText;
            btn.onclick = () => handleAnswer(index, btn);
            ui.options.appendChild(btn);
        });
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            if(!isPaused) {
                timeLeft--;
                updateTimer();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleAnswer(-1, null);
                }
            }
        }, 1000);
    }

    function updateTimer() {
        ui.timer.innerText = timeLeft;
        ui.timer.style.color = timeLeft < 5 ? 'red' : 'var(--neon-pink)';
    }

    function handleAnswer(selectedIndex, btnElement) {
        if (isPaused) return;
        isPaused = true;
        clearInterval(timerInterval);

        const q = shuffledQuestions[currentQIndex];
        const allBtns = document.querySelectorAll('.option-btn');
        const correctBtn = allBtns[q.a];
        let isCorrect = false;

        if (selectedIndex === q.a) {
            isCorrect = true;
            btnElement.classList.add('correct');
            score += 10 + Math.max(0, timeLeft);
            ui.score.innerText = score;
        } else {
            if(btnElement) btnElement.classList.add('wrong');
            correctBtn.classList.add('correct');
        }
        showFeedback(isCorrect, q.exp);
    }

    function showFeedback(isCorrect, explanation) {
        ui.modalTitle.innerText = isCorrect ? "CORRECT ANSWER" : "WRONG ANSWER";
        ui.modalTitle.style.color = isCorrect ? "var(--neon-green)" : "var(--neon-pink)";
        ui.modalExp.innerText = explanation;
        setTimeout(() => { ui.modal.classList.add('active'); }, 600);
    }

    function nextQuestion() {
        currentQIndex++;
        loadQuestion();
    }

    function endGame(completed) {
        ui.gameOver.classList.remove('hidden-screen');
        ui.finalScore.innerText = score;
        ui.progress.style.width = '100%';
        
        if (score > 1200) {
            ui.gameOverTitle.innerHTML = "LEVEL B1<br>MASTERED";
            ui.gameOverTitle.style.color = "var(--neon-green)";
            ui.feedbackMsg.innerText = "Language matrix synchronized. Ready for Advanced levels.";
        } else {
            ui.gameOverTitle.innerHTML = "SESSION<br>ENDED";
            ui.feedbackMsg.innerText = "Intermediate protocols incomplete. Review grammar data.";
        }
    }

    function useFiftyFifty() {
        if (!powerUps.fifty || isPaused) return;
        const q = shuffledQuestions[currentQIndex];
        const buttons = Array.from(document.querySelectorAll('.option-btn'));
        let wrongIndices = [];
        q.opt.forEach((_, i) => { if(i !== q.a) wrongIndices.push(i); });
        wrongIndices.sort(() => Math.random() - 0.5);
        buttons[wrongIndices[0]].classList.add('hidden');
        buttons[wrongIndices[1]].classList.add('hidden');
        powerUps.fifty = false;
        document.getElementById('pu-5050').classList.add('used');
    }

    function useSkip() {
        if (!powerUps.skip || isPaused) return;
        powerUps.skip = false;
        document.getElementById('pu-skip').classList.add('used');
        currentQIndex++;
        loadQuestion();
    }

    function useTime() {
        if (!powerUps.time || isPaused) return;
        timeLeft += 15;
        updateTimer();
        powerUps.time = false;
        document.getElementById('pu-time').classList.add('used');
    }
</script>
</body>
</html>
